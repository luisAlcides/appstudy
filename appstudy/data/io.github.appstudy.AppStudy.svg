<?xml version="1.0" encoding="UTF-8"?>
<!-- Icono de AppStudy: la tarjeta que estudias, con el asterisco de Bit encima.
     Mismo dibujo que la mascota: once rayos en punta y el acento terracota. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E28A63"/>
      <stop offset="1" stop-color="#C4522C"/>
    </linearGradient>
    <linearGradient id="papel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF6"/>
      <stop offset="1" stop-color="#F0EADD"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#fondo)"/>

  <!-- La tarjeta de atrás, asomando por el lomo -->
  <rect x="34" y="30" width="62" height="70" rx="11"
        fill="#8F3A11" opacity="0.30" transform="rotate(-9 64 64)"/>

  <!-- La tarjeta de delante -->
