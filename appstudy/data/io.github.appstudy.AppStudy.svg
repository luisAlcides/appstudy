    <circle cx="65" cy="58" r="4.6" fill="#D97757"/>
    <rect x="46" y="82" width="38" height="5.5" rx="2.75" fill="#C6BDA9"/>
    <rect x="46" y="92" width="24" height="5.5" rx="2.75" fill="#D5CDBA"/>
  </g>
